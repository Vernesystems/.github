name: Refresh field notes

on:
  schedule:
    - cron: "17 3 * * *" # daily, 09:17 in Dhaka
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: field-notes
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Update the list from the blog feed
        run: python3 scripts/update_notes.py

      - name: Commit if the list changed
        run: |
          if git diff --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(profile): refresh field notes"
          git push
